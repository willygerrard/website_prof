version: '3.9'

services:
  php:
    build: .

    container_name: website_prof_php

    ports:
    - "9000:9000"

    volumes:
      - /var/www/html/website_prof:/var/www/html

    working_dir: /var/www/html

    restart: unless-stopped
    environment:
      FONNTE_TOKEN: ${FONNTE_TOKEN}
    networks:          
      - sija_net
  db:
    image: mariadb:11

    container_name: website_prof_db

    restart: unless-stopped
    
    ports:
        - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql
    
    networks: 
      - sija_net
volumes:
  mariadb_data:
networks:             
  sija_net:
    driver: bridge